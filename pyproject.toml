[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-dashboard"
version = "0.1.0"
description = "Research slice: Sharpe, Sortino, max drawdown, rolling beta, and hit rate from return series without look-ahead; costed vs gross equity diagnostics."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "M.Varun", email = "116015799+Mavarun@users.noreply.github.com" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pytest",
]

[project.optional-dependencies]
stats = ["statsmodels"]
market = ["yfinance"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
